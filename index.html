<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DhivehiProject — Translate &amp; Write in Dhivehi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thaana&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#212121;
    --composer-bg:#2f2f2f;
    --bubble-bg:#2f2f2f;
    --panel-bg:#171717;
    --border:#3a3a3a;
    --text:#ececec;
    --muted:#9b9b9b;
    --accent:#39bbb0;
    --accent-dark:#2a8a82;
    --danger:#ff8577;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    display:flex;
    flex-direction:column;
  }
  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
    max-width:820px;
    margin:0 auto;
    width:100%;
  }

  /* ---- top bar ---- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    flex-shrink:0;
  }
  .logo{
    display:flex;
    align-items:center;
    gap:9px;
    text-decoration:none;
  }
  .logo-mark{
    width:26px;
    height:26px;
    border-radius:8px;
    flex-shrink:0;
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    color:#04211f;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Noto Sans Thaana','MV Boli',sans-serif;
    font-size:15px;
    font-weight:700;
  }
  .logo-word{
    font-size:18px;
    font-weight:700;
    letter-spacing:-.01em;
    white-space:nowrap;
  }
  .logo-word .w1{color:var(--text);}
  .logo-word .w2{color:var(--accent);}
  .logo.lg .logo-mark{width:44px;height:44px;border-radius:12px;font-size:24px;}
  .logo.lg .logo-word{font-size:30px;}
  .icon-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--muted);
    width:34px;
    height:34px;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
  }
  .icon-btn:hover{color:var(--text);border-color:var(--muted);}
  .icon-btn.small{width:28px;height:28px;font-size:13px;border:none;background:transparent;}

  /* ---- thread ---- */
  .thread{
    flex:1;
    overflow-y:auto;
    padding:10px 18px 20px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .empty-state{
    margin:auto;
    text-align:center;
    color:var(--muted);
    padding:40px 20px;
  }
  .empty-title{font-size:26px;font-weight:600;color:var(--text);margin-bottom:8px;}
  .empty-sub{font-size:14px;max-width:360px;margin:0 auto;line-height:1.6;}

  .msg{max-width:100%;}
  .msg.user{
    align-self:flex-end;
    max-width:75%;
    background:var(--bubble-bg);
    border-radius:20px;
    padding:10px 16px;
    font-size:15px;
    line-height:1.6;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .msg.user.dv-text{font-family:'MV Boli','Noto Sans Thaana',sans-serif;font-size:19px;line-height:2;}

  .msg.assistant{
    display:flex;
    gap:12px;
    align-self:flex-start;
    max-width:100%;
    width:100%;
  }
  .avatar{
    width:28px;
    height:28px;
    border-radius:50%;
    flex-shrink:0;
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:700;
    color:#04211f;
    margin-top:2px;
  }
  .msg.assistant .content{
    font-size:15px;
    line-height:1.75;
    white-space:pre-wrap;
    word-break:break-word;
    padding-top:3px;
    flex:1;
    min-width:0;
  }
  .msg.assistant .content.dv-text{
    font-family:'MV Boli','Noto Sans Thaana',sans-serif;
    font-size:17px;
    line-height:2;
  }
  .msg.assistant .content.error-text{color:var(--danger);font-family:'Inter',sans-serif;font-size:14px;}
  .msg-actions{margin-left:40px;margin-top:2px;}
  .mini-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--muted);
    padding:4px 10px;
    border-radius:7px;
    font-size:11px;
    cursor:pointer;
    font-family:inherit;
  }
  .mini-btn:hover{color:var(--text);border-color:var(--muted);}

  .typing{display:inline-flex;gap:4px;align-items:center;height:20px;}
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--muted);
    animation:blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

  /* ---- composer ---- */
  .composer-wrap{
    flex-shrink:0;
    padding:8px 18px 20px;
  }
  .toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:10px;
  }
  .segmented{
    display:flex;
    background:var(--composer-bg);
    border:1px solid var(--border);
    border-radius:999px;
    padding:3px;
  }
  .seg-btn{
    background:transparent;
    border:none;
    color:var(--muted);
    padding:6px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .seg-btn.active{background:var(--accent);color:#04211f;}
  .toolbar-options{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .pill{
    background:transparent;
    border:1px solid var(--border);
    color:var(--muted);
    padding:6px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .pill.active{border-color:var(--accent);color:var(--accent);}
  .pill-select{
    width:auto;
    background:var(--composer-bg);
    border:1px solid var(--border);
    color:var(--text);
    padding:6px 10px;
    border-radius:999px;
    font-size:12px;
    font-family:inherit;
  }

  .composer{
    display:flex;
    align-items:flex-end;
    gap:8px;
    background:var(--composer-bg);
    border:1px solid var(--border);
    border-radius:26px;
    padding:8px 8px 8px 20px;
  }
  .composer textarea{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    resize:none;
    color:var(--text);
    font-family:inherit;
    font-size:15px;
    line-height:1.5;
    max-height:160px;
    padding:6px 0;
  }
  .composer textarea::placeholder{color:var(--muted);}
  .send-btn{
    width:34px;
    height:34px;
    border-radius:50%;
    border:none;
    background:var(--accent);
    color:#04211f;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .send-btn:disabled{background:#454545;color:#7a7a7a;cursor:not-allowed;}
  .send-btn:not(:disabled):hover{background:var(--accent-dark);}

  .footer-note{
    text-align:center;
    font-size:11.5px;
    color:var(--muted);
    margin-top:10px;
    line-height:1.5;
  }

  /* ---- loading ---- */
  .loading-view{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-size:13px;
  }

  /* ---- auth screen ---- */
  .auth-view{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .auth-card{width:100%;max-width:360px;}
  .google-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:#fff;
    color:#1f1f1f;
    border:none;
    border-radius:10px;
    padding:11px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .google-btn:hover{background:#f1f1f1;}
  .google-btn:disabled{opacity:.6;cursor:not-allowed;}
  .auth-divider{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--muted);
    font-size:12px;
    margin:18px 0;
  }
  .auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border);}
  .auth-field{margin-bottom:12px;}
  .auth-field label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
    font-weight:600;
  }
  .auth-field input{
    width:100%;
    background:var(--composer-bg);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:10px 12px;
    font-size:14px;
    font-family:inherit;
  }
  .auth-submit-btn{
    width:100%;
    background:var(--accent);
    color:#04211f;
    border:none;
    border-radius:8px;
    padding:11px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    margin-top:4px;
  }
  .auth-submit-btn:hover{background:var(--accent-dark);}
  .auth-submit-btn:disabled{opacity:.6;cursor:not-allowed;}
  .auth-status{
    font-size:12.5px;
    color:var(--muted);
    margin-top:14px;
    text-align:center;
    line-height:1.5;
    min-height:16px;
  }
  .auth-status.error{color:var(--danger);}
  .auth-status.success{color:var(--accent);}
  .auth-toggle{text-align:center;font-size:13px;color:var(--muted);margin-top:20px;}
  .auth-toggle button{
    background:none;
    border:none;
    color:var(--accent);
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    font-size:13px;
    margin-left:4px;
  }
</style>
</head>
<body>

<div class="loading-view" id="loadingView">Loading…</div>

<div class="auth-view" id="authView" style="display:none;">
  <div class="auth-card">
    <div class="logo lg" style="justify-content:center;margin-bottom:24px;">
      <span class="logo-mark">ދ</span>
      <span class="logo-word"><span class="w1">Dhivehi</span><span class="w2">Project</span></span>
    </div>

    <button class="google-btn" id="googleSignInBtn" type="button">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.83.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.97 10.71a5.4 5.4 0 0 1 0-3.42V4.96H.96a9 9 0 0 0 0 8.08l3.01-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-divider"><span>or</span></div>

    <form id="authForm">
      <div class="auth-field">
        <label>Email</label>
        <input type="email" id="authEmail" required autocomplete="email">
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input type="password" id="authPassword" required autocomplete="current-password" minlength="6">
      </div>
      <button type="submit" class="auth-submit-btn" id="authSubmitBtn">Sign in</button>
    </form>

    <div class="auth-status" id="authStatus"></div>

    <div class="auth-toggle">
      <span id="authToggleText">Don't have an account?</span>
      <button type="button" id="authToggleBtn">Sign up</button>
    </div>
  </div>
</div>

<div class="app" id="appView" style="display:none;">

  <div class="topbar">
    <div class="logo">
      <span class="logo-mark">ދ</span>
      <span class="logo-word"><span class="w1">Dhivehi</span><span class="w2">Project</span></span>
    </div>
    <button class="icon-btn" id="signOutBtn" title="Sign out" aria-label="Sign out">⏻</button>
  </div>

  <main class="thread" id="thread">
    <div class="empty-state" id="emptyState">
      <div class="logo lg" style="justify-content:center;margin-bottom:14px;">
        <span class="logo-mark">ދ</span>
        <span class="logo-word"><span class="w1">Dhivehi</span><span class="w2">Project</span></span>
      </div>
      <div class="empty-sub">Translate between English and Dhivehi, or write original Dhivehi content — essays, letters, speeches, and more.</div>
    </div>
  </main>

  <div class="composer-wrap">
    <div class="toolbar">
      <div class="segmented" id="modeSwitch">
        <button class="seg-btn active" data-mode="translate">Translate</button>
        <button class="seg-btn" data-mode="write">Write</button>
      </div>
      <div class="toolbar-options" id="translateOptions">
        <button class="pill active" id="dirEnDv">EN → DV</button>
        <button class="icon-btn small" id="swapDir" title="Swap direction">⇄</button>
        <button class="pill" id="dirDvEn">DV → EN</button>
      </div>
      <div class="toolbar-options" id="writeOptions" style="display:none;">
        <select class="pill-select" id="writeType">
          <option value="general write-up">General write-up</option>
          <option value="essay">Essay</option>
          <option value="letter">Letter</option>
          <option value="speech">Speech</option>
          <option value="social media post">Social media post</option>
          <option value="short story">Short story</option>
          <option value="poem">Poem</option>
        </select>
        <select class="pill-select" id="writeLength">
          <option value="short (roughly 100-150 words)">Short</option>
          <option value="medium (roughly 250-400 words)" selected>Medium</option>
          <option value="long (roughly 500-800 words)">Long</option>
        </select>
        <select class="pill-select" id="writeTone">
          <option value="neutral, natural">Neutral</option>
          <option value="formal">Formal</option>
          <option value="casual, friendly">Casual</option>
          <option value="persuasive">Persuasive</option>
        </select>
      </div>
    </div>
    <div class="composer">
      <textarea id="promptInput" rows="1" placeholder="Type text to translate..."></textarea>
      <button class="send-btn" id="sendBtn" disabled>↑</button>
    </div>
    <div class="footer-note">DhivehiProject can make mistakes. Please double-check important translations.</div>
  </div>

</div>

<script>
// Backend provider/model is fixed and configured server-side via Vercel
// environment variables (see api/generate.js) — never exposed in the UI.
const PROVIDER = 'google';
const MODEL = 'gemini-3.6-flash';

// =========================================================
// Auth (Supabase) — gates the whole app behind sign-in
// =========================================================
let supabaseClient = null;
let currentSession = null;
let authMode = 'signin';

const loadingView = document.getElementById('loadingView');
const authView = document.getElementById('authView');
const appView = document.getElementById('appView');
const authStatusEl = document.getElementById('authStatus');

function setAuthStatus(msg, kind){
  authStatusEl.textContent = msg || '';
  authStatusEl.classList.toggle('error', kind === 'error');
  authStatusEl.classList.toggle('success', kind === 'success');
}

function renderAuthState(){
  loadingView.style.display = 'none';
  if(currentSession){
    authView.style.display = 'none';
    appView.style.display = 'flex';
  } else {
    appView.style.display = 'none';
    authView.style.display = 'flex';
  }
}

async function initAuth(){
  let cfg = {};
  try{
    const r = await fetch('/api/config');
    cfg = await r.json();
  } catch(e){ /* ignore, handled below */ }

  if(!cfg.supabaseUrl || !cfg.supabaseAnonKey){
    loadingView.style.display = 'none';
    appView.style.display = 'none';
    authView.style.display = 'flex';
    document.getElementById('googleSignInBtn').disabled = true;
    document.getElementById('authSubmitBtn').disabled = true;
    setAuthStatus('Sign-in is not configured yet. Add SUPABASE_URL and SUPABASE_ANON_KEY in this project’s Vercel settings, then redeploy.', 'error');
    return;
  }

  supabaseClient = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

  const { data } = await supabaseClient.auth.getSession();
  currentSession = data.session;
  renderAuthState();

  supabaseClient.auth.onAuthStateChange((_event, session)=>{
    currentSession = session;
    renderAuthState();
  });
}

document.getElementById('googleSignInBtn').addEventListener('click', async ()=>{
  if(!supabaseClient) return;
  await supabaseClient.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin }
  });
});

document.getElementById('authForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  if(!supabaseClient) return;
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const btn = document.getElementById('authSubmitBtn');
  btn.disabled = true;
  setAuthStatus('');
  try{
    if(authMode === 'signin'){
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if(error) throw error;
    } else {
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if(error) throw error;
      if(data.user && !data.session){
        setAuthStatus('Account created — check your email to confirm it before signing in.', 'success');
      }
    }
  } catch(err){
    setAuthStatus(err.message, 'error');
  }
  btn.disabled = false;
});

document.getElementById('authToggleBtn').addEventListener('click', ()=>{
  authMode = authMode === 'signin' ? 'signup' : 'signin';
  document.getElementById('authSubmitBtn').textContent = authMode === 'signin' ? 'Sign in' : 'Create account';
  document.getElementById('authToggleText').textContent = authMode === 'signin' ? "Don't have an account?" : 'Already have an account?';
  document.getElementById('authToggleBtn').textContent = authMode === 'signin' ? 'Sign up' : 'Sign in';
  setAuthStatus('');
});

document.getElementById('signOutBtn').addEventListener('click', async ()=>{
  if(!supabaseClient) return;
  await supabaseClient.auth.signOut();
});

initAuth();

// ---- Mode switch (Translate / Write) ----
let currentMode = 'translate';
const modeSwitch = document.getElementById('modeSwitch');
const translateOptions = document.getElementById('translateOptions');
const writeOptions = document.getElementById('writeOptions');
const promptInput = document.getElementById('promptInput');

modeSwitch.querySelectorAll('.seg-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    modeSwitch.querySelectorAll('.seg-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
    translateOptions.style.display = currentMode==='translate' ? 'flex':'none';
    writeOptions.style.display = currentMode==='write' ? 'flex':'none';
    promptInput.placeholder = currentMode==='translate' ? 'Type text to translate...' : "Describe what you'd like written in Dhivehi...";
  });
});

// ---- Translate direction ----
let direction = 'en-dv';
const dirEnDv = document.getElementById('dirEnDv');
const dirDvEn = document.getElementById('dirDvEn');
function setDirection(d){
  direction = d;
  dirEnDv.classList.toggle('active', d==='en-dv');
  dirDvEn.classList.toggle('active', d==='dv-en');
  promptInput.placeholder = d==='en-dv' ? 'Type text to translate...' : 'ދިވެހި ލިޔުމެއް ޓައިޕްކުރައްވާ...';
}
dirEnDv.addEventListener('click', ()=>setDirection('en-dv'));
dirDvEn.addEventListener('click', ()=>setDirection('dv-en'));
document.getElementById('swapDir').addEventListener('click', ()=>setDirection(direction==='en-dv'?'dv-en':'en-dv'));

// ---- Composer behavior ----
const sendBtn = document.getElementById('sendBtn');
function autoResize(){
  promptInput.style.height = 'auto';
  promptInput.style.height = Math.min(promptInput.scrollHeight, 160) + 'px';
}
function updateSendState(){ sendBtn.disabled = !promptInput.value.trim(); }
promptInput.addEventListener('input', ()=>{ autoResize(); updateSendState(); });
promptInput.addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); handleSend(); }
});
sendBtn.addEventListener('click', handleSend);

// ---- Thread rendering ----
const thread = document.getElementById('thread');
const emptyState = document.getElementById('emptyState');
function hideEmptyState(){ if(emptyState) emptyState.style.display = 'none'; }
function scrollToBottom(){ thread.scrollTop = thread.scrollHeight; }
const THAANA_RE = /[ހ-޿]/;

function addUserMessage(text){
  hideEmptyState();
  const el = document.createElement('div');
  el.className = 'msg user';
  const isDv = THAANA_RE.test(text);
  el.style.direction = isDv ? 'rtl' : 'ltr';
  el.style.textAlign = isDv ? 'right' : 'left';
  if(isDv) el.classList.add('dv-text');
  el.textContent = text;
  thread.appendChild(el);
  scrollToBottom();
}

function addAssistantPlaceholder(){
  hideEmptyState();
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';
  wrap.innerHTML = '<div class="avatar">ދ</div><div class="content"><span class="typing"><span></span><span></span><span></span></span></div>';
  thread.appendChild(wrap);
  scrollToBottom();
  return wrap;
}

function fillAssistant(wrap, text, isDv, isError){
  const content = wrap.querySelector('.content');
  content.textContent = text;
  content.classList.toggle('dv-text', !!isDv && !isError);
  content.classList.toggle('error-text', !!isError);
  content.style.direction = (isDv && !isError) ? 'rtl' : 'ltr';
  content.style.textAlign = (isDv && !isError) ? 'right' : 'left';
  if(!isError){
    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    const copyBtn = document.createElement('button');
    copyBtn.className = 'mini-btn';
    copyBtn.textContent = 'Copy';
    copyBtn.addEventListener('click', ()=>{
      navigator.clipboard.writeText(text);
      copyBtn.textContent = 'Copied';
      setTimeout(()=>{ copyBtn.textContent = 'Copy'; }, 1200);
    });
    actions.appendChild(copyBtn);
    wrap.appendChild(actions);
  }
  scrollToBottom();
}

// ---- Send handler ----
async function handleSend(){
  const text = promptInput.value.trim();
  if(!text) return;

  addUserMessage(text);
  promptInput.value = '';
  autoResize();
  updateSendState();

  const placeholder = addAssistantPlaceholder();

  let system, isDvResult;
  if(currentMode === 'translate'){
    const targetLang = direction === 'en-dv' ? 'Dhivehi (Thaana script)' : 'English';
    isDvResult = direction === 'en-dv';
    system = `You are an expert professional translator specializing in Dhivehi (the Maldivian language, written in Thaana script) and English. Translate the user's text into ${targetLang}. Preserve tone, meaning, and register. Output ONLY the translated text, in the correct script, with no preamble, explanation, or quotation marks around it.`;
  } else {
    isDvResult = true;
    const type = document.getElementById('writeType').value;
    const length = document.getElementById('writeLength').value;
    const tone = document.getElementById('writeTone').value;
    system = `You are a skilled native Dhivehi writer. Write fluent, natural, grammatically correct Dhivehi using proper Thaana script. Do not transliterate or use Latin characters. The content type is: ${type}. Target length: ${length}. Tone: ${tone}. Output ONLY the finished Dhivehi content, with no English preamble, explanation, or notes.`;
  }

  try{
    const headers = { 'content-type': 'application/json' };
    if(currentSession && currentSession.access_token){
      headers['Authorization'] = 'Bearer ' + currentSession.access_token;
    }
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers,
      body: JSON.stringify({ provider: PROVIDER, model: MODEL, system, message: text })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    fillAssistant(placeholder, data.text || '(empty response)', isDvResult, false);
  } catch(err){
    fillAssistant(placeholder, 'Error: ' + err.message, false, true);
  }
}
</script>
